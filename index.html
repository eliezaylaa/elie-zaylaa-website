<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Elie Zaylaa</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        background: #020617;
      }

      body {
        margin: 0;
        min-height: 100svh;
        background:
          radial-gradient(
            circle at 20% 20%,
            rgba(59, 130, 246, 0.25),
            transparent 45%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(14, 165, 233, 0.2),
            transparent 45%
          ),
          #020617;
      }

      .card {
        width: 100%;
        max-width: 520px;
        padding: 40px;
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(18px);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h1 {
        margin: 0;
        margin-top: 19px;
        margin-left: 0px;
        font-size: clamp(80px, 8vw, 80px);
        letter-spacing: -0.06em;
        line-height: 1;
        color: #ffffff;
        display: flex;
      }

      .icons {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .icons a {
        all: unset;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .icons img,
      .icons svg {
        width: 90px;
        height: 100px;
        filter: brightness(0) invert(1);
        opacity: 0.85;
        transition: 0.2s;
      }

      .icons img:hover,
      .icons svg:hover {
        opacity: 1;
        transform: scale(1.15);
      }

      .subtitle {
        margin: 18px 0 30px;
        color: #94a3b8;
        font-size: 17px;
        line-height: 1.6;
      }

      .links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        border-radius: 16px;
        text-decoration: none;
        color: #ffffff;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.22);
        transition: 0.2s ease;
      }

      a.primary {
        background: linear-gradient(135deg, #2563eb, #0ea5e9);
        border: none;
      }

      a:hover {
        transform: translateY(-3px);
        border-color: rgba(147, 197, 253, 0.6);
        background: rgba(255, 255, 255, 0.13);
      }

      a.primary:hover {
        background: linear-gradient(135deg, #1d4ed8, #0284c7);
      }

      .footer {
        margin-top: 26px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #64748b;
        font-size: 12px;
      }
      .site-footer {
        position: fixed;
        bottom: 12px;
        width: 100%;
        text-align: right;
        font-size: 12px;
        color: #64748b;
      }

      @media (max-width: 520px) {
        .card {
          padding: 30px 24px;
        }

        .links {
          grid-template-columns: 1fr;
        }

        .footer {
          flex-direction: column;
          text-align: center;
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="header">
        <h1>Elie<br />Zaylaa</h1>

        <div class="icons">
          <a href="https://github.com/eliezaylaa" target="_blank">
            <img
              src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg"
            />
          </a>

          <a href="https://linkedin.com/in/eliezaylaa" target="_blank">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="white">
              <path
                d="M19 0h-14c-2.76 0-5 2.24-5 5v14c0 2.76 2.24 5 5 5h14c2.76 0 5-2.24 5-5v-14c0-2.76-2.24-5-5-5zm-11 19h-3v-10h3v10zm-1.5-11.3c-.97 0-1.75-.78-1.75-1.75s.78-1.75 1.75-1.75 1.75.78 1.75 1.75-.78 1.75-1.75 1.75zm13.5 11.3h-3v-5.6c0-1.34-.03-3.06-1.87-3.06-1.87 0-2.16 1.46-2.16 2.97v5.69h-3v-10h2.88v1.37h.04c.4-.75 1.37-1.54 2.82-1.54 3.02 0 3.58 1.99 3.58 4.58v5.59z"
              />
            </svg>
          </a>
        </div>
      </div>

      <div class="footer">
        <span>Paris, France</span>
      </div>
    </main>
  </body>
</html>
